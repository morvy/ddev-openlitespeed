name: tests
on:
  push:
    branches: [ main, master ]
    paths-ignore: [ "**.md" ]
  pull_request:
    paths-ignore: [ "**.md" ]
  schedule:
    - cron: '25 08 * * *'
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false
  # Allow other workflows (e.g. release) to run this suite as a gate.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: "${{ matrix.bats_tag }} (ddev ${{ matrix.ddev_version }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # DDEV HEAD is an early warning only, so it never blocks a release (release.yml).
    continue-on-error: ${{ matrix.ddev_version == 'HEAD' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm]
        ddev_version: [stable, HEAD]
        bats_tag: [php56, php74, php83, php84, php85, php86]
        exclude:
          # PHP 8.6 needs a DDEV release newer than v1.25.4.
          - ddev_version: stable
            bats_tag: php86
    steps:
      - name: ${{ matrix.bats_tag }}
        uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ github.repository }}
          addon_ref: ${{ github.ref }}
          test_command: bats ./tests/test.bats --filter-tags ${{ matrix.bats_tag }}
