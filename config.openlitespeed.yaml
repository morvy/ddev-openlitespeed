#ddev-generated
# Turn the web container into an OpenLiteSpeed server.
# DDEV stops managing nginx/apache-fpm. lsphp (LiteSpeed SAPI PHP) runs either
# in the web container (native, PHP 8.1-8.5) or in a bookworm sidecar (PHP
# 7.4/8.0); the pre-start hook picks the mode and generates the sidecar
# docker-compose file when needed. OLS connects to whichever lsphp is active.
webserver_type: generic

hooks:
  pre-start:
    - exec-host: "bash ${DDEV_APPROOT}/.ddev/openlitespeed/sync-lsphp-mode.sh"

web_extra_daemons:
  # lsphp for native (trixie) PHP versions. Idles when a sidecar is in use.
  - name: "lsphp"
    command: "/usr/local/bin/ddev-openlitespeed-lsphp"
    directory: /var/www/html
  - name: "openlitespeed"
    command: "/usr/local/bin/ddev-openlitespeed-start"
    directory: /var/www/html

# container_port 80 is served by OLS; the router terminates public TLS and
# forwards plain HTTP to it, so http_port/https_port both map to container 80.
# (No WebAdmin console: OLS can't run its admin PHP in this container — see README.)
web_extra_exposed_ports:
  - name: "openlitespeed"
    container_port: 80
    http_port: 80
    https_port: 443
