name: openlitespeed

# Generic web server: DDEV does not start nginx/apache-fpm; OpenLiteSpeed
# (installed into the web container) serves the project instead.
# Needs the `generic` webserver_type (DDEV v1.24.3+); v1.24.10 is the add-on template minimum.
ddev_version_constraint: '>= v1.24.10'

# v1.0.x ran PHP 7.4/8.0 in a bookworm lsphp sidecar. The sury LiteSpeed SAPI
# covers every PHP version in the web container now, so drop those files on
# upgrade (only if still unmodified add-on files / our generated compose).
pre_install_actions:
  - |
    #ddev-description:Remove the lsphp sidecar files of ddev-openlitespeed v1.0.x
    d="${DDEV_APPROOT}/.ddev"
    for f in "${d}/openlitespeed/sync-lsphp-mode.sh" "${d}/openlitespeed/lsphp-sidecar/Dockerfile"; do
      if [ -f "${f}" ] && grep -qF "#ddev-generated" "${f}"; then rm -f "${f}"; fi
    done
    rmdir "${d}/openlitespeed/lsphp-sidecar" "${d}/openlitespeed" 2>/dev/null || true
    f="${d}/docker-compose.openlitespeed-lsphp.yaml"
    if [ -f "${f}" ] && grep -qF "generated by ddev-openlitespeed" "${f}"; then rm -f "${f}"; fi

project_files:
  - config.openlitespeed.yaml
  - docker-compose.openlitespeed.yaml
  - web-build/Dockerfile.openlitespeed
  - web-build/openlitespeed/httpd_config.conf
  - web-build/openlitespeed/vhost.conf
  - web-build/openlitespeed/ddev-openlitespeed-start
  - web-build/openlitespeed/ddev-openlitespeed-lsphp

# Files listed in project_files that carry #ddev-generated are removed
# automatically on `ddev add-on remove openlitespeed`. Removing
# config.openlitespeed.yaml reverts webserver_type to the project default.
