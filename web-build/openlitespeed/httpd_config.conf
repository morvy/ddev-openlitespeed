#ddev-generated
# Minimal OpenLiteSpeed main config for DDEV.
# - one virtual host ("ddev") rooted at the project mount
# - PHP via lsphp on ##LSPHP_ADDRESS## (127.0.0.1:9000 when lsphp runs in this
#   container, or the sidecar host when PHP is 7.4/8.0). The start script fills
#   in the address. autoStart 0 => OLS connects, never forks (this OLS build has
#   no working suEXEC/cgid helper).
# - :80 for router traffic, :443 (DDEV master cert) for direct host access
serverName                DDEV
user                      nobody
group                     nogroup
priority                  0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
adminEmails               root@localhost
indexFiles                index.php, index.html
disableWebAdmin           0

errorlog logs/error.log {
  logLevel                WARN
  rollingSize             10M
  enableStderrLog         1
}

accessLog logs/access.log {
  rollingSize             10M
  keepDays                7
  compressArchive         0
}

tuning {
  maxConnections          10000
  connTimeout             300
  maxKeepAliveReq         10000
  keepAliveTimeout        5
  eventDispatcher         best
  enableGzipCompress      1
  enableBrCompress        4
  quicEnable              0
  # Trust ddev-router's X-Forwarded-For so PHP sees the real client IP.
  useIpInProxyHeader      1
}

extprocessor lsphp {
  type                    lsapi
  address                 ##LSPHP_ADDRESS##
  maxConns                10
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               0
  path                    fcgi-bin/lsphp
  backlog                 100
  instances               1
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1400
  procHardLimit           1500
}

scripthandler {
  add                     lsapi:lsphp php
}

# LSCache module present but disabled by default (enable per-project if desired).
module cache {
  internal                1
  checkPrivateCache       1
  checkPublicCache        1
  maxCacheObjSize         10000000
  maxStaleAge             200
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  enableCache             0
  expireInSeconds         3600
  enablePrivateCache      0
  privateExpireInSeconds  3600
}

virtualHost ddev {
  vhRoot                  /var/www/html
  configFile              conf/vhosts/ddev/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              0
  setUIDMode              0
}

listener http {
  address                 *:80
  secure                  0
  map                     ddev *
}

listener https {
  address                 *:443
  secure                  1
  keyFile                 /etc/ssl/certs/master.key
  certFile                /etc/ssl/certs/master.crt
  map                     ddev *
}
