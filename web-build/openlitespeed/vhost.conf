#ddev-generated
# Virtual host template. ##DDEV_DOCROOT## is replaced with the project's real
# docroot (/var/www/html[/<docroot>]) by ddev-openlitespeed-start at each start,
# so `ddev config --docroot=...` takes effect without an image rebuild.
docRoot                   ##DDEV_DOCROOT##
enableGzip                1

# No directory listings: OLS hands a directory without an index file to the
# autoIndexURI, a context that denies all access, so the request ends in a 403
# (DDEV's 403 page, below), like nginx-fpm/apache-fpm.
index {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               1
  autoIndexURI            /ddev-webserver-no-index/
}

errorlog {
  useServer               1
}

accesslog {
  useServer               1
}

# ddev-router terminates public TLS and forwards plain HTTP to OLS on :80, so
# without this PHP would think every request is http. Translate the router's
# X-Forwarded-Proto back into real HTTPS server vars (is_ssl()/isSecure(),
# absolute URL generation, redirects all depend on these). autoLoadHtaccess
# keeps the project's own .htaccess (WordPress/Drupal/Laravel rewrites) working.
rewrite {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteCond %{HTTP:X-Forwarded-Proto} https
RewriteRule .* - [E=HTTPS:on,E=REQUEST_SCHEME:https,E=SERVER_PORT:443]
END_rules
}

context / {
  location                ##DDEV_DOCROOT##
  allowBrowse             1
  indexFiles              index.php, index.html
  addDefaultCharset       off
}

# DDEV's error pages (static HTML in the web image since DDEV v1.25.4) for the
# 404s and 403s OLS generates itself; PHP's own 403/404 responses pass through.
# On older DDEV the files are missing and OLS falls back to its built-in pages.
errorPage 404 {
  url                     /ddev-webserver-404-error
}

errorPage 403 {
  url                     /ddev-webserver-403-error
}

context /ddev-webserver-404-error {
  location                /usr/local/share/ddev-webserver-404-error.html
  allowBrowse             1
  extraHeaders            <<<END_extraHeaders
set X-Ddev-404-Source "ddev-webserver (openlitespeed)"
END_extraHeaders
}

context /ddev-webserver-403-error {
  location                /usr/local/share/ddev-webserver-403-error.html
  allowBrowse             1
  extraHeaders            <<<END_extraHeaders
set X-Ddev-403-Source "ddev-webserver (openlitespeed)"
END_extraHeaders
}

# autoIndexURI target: always 403 (allowBrowse 0), never a listing.
context /ddev-webserver-no-index/ {
  location                /usr/local/share/
  allowBrowse             0
}
