#ddev-generated
# Virtual host template. ##DDEV_DOCROOT## is replaced with the project's real
# docroot (/var/www/html[/<docroot>]) by ddev-openlitespeed-start at each start,
# so `ddev config --docroot=...` takes effect without an image rebuild.
docRoot                   ##DDEV_DOCROOT##
enableGzip                1

index {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

errorlog {
  useServer               1
}

accesslog {
  useServer               1
}

# ddev-router terminates public TLS and forwards plain HTTP to OLS on :80, so
# without this PHP would think every request is http. Translate the router's
# X-Forwarded-Proto back into real HTTPS server vars (is_ssl()/isSecure(),
# absolute URL generation, redirects all depend on these). autoLoadHtaccess
# keeps the project's own .htaccess (WordPress/Drupal/Laravel rewrites) working.
rewrite {
  enable                  1
  autoLoadHtaccess        1
  rules                   <<<END_rules
RewriteCond %{HTTP:X-Forwarded-Proto} https
RewriteRule .* - [E=HTTPS:on,E=REQUEST_SCHEME:https,E=SERVER_PORT:443]
END_rules
}

context / {
  location                ##DDEV_DOCROOT##
  allowBrowse             1
  indexFiles              index.php, index.html
  addDefaultCharset       off
}
